services:
  private-chat:
    build: .
    image: private-chat:1.0.0
    container_name: private-chat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动自动创建管理员（仅当数据库无管理员时生效）
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me-please}"
      # 容器内数据统一落地到 /data（已挂载卷）
      DATABASE_PATH: /data/chat.db
      STORAGE_UPLOAD_DIR: /data/uploads
      # 经反向代理开启 HTTPS 后改为 true
      SECURITY_COOKIE_SECURE: "${SECURITY_COOKIE_SECURE:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
